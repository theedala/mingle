version: '3.8'

services:
  # PostgreSQL - User profiles, preferences, reputation
  postgres:
    image: postgres:16-alpine
    container_name: mingle_postgres
    environment:
      POSTGRES_USER: mingle
      POSTGRES_PASSWORD: mingle_secret
      POSTGRES_DB: mingle
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mingle"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Sessions, presence, caching, pub/sub
  redis:
    image: redis:7-alpine
    container_name: mingle_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Chat messages
  mongodb:
    image: mongo:7
    container_name: mingle_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mingle
      MONGO_INITDB_ROOT_PASSWORD: mingle_secret
      MONGO_INITDB_DATABASE: mingle
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse - Analytics & ML pipeline
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: mingle_clickhouse
    environment:
      CLICKHOUSE_USER: mingle
      CLICKHOUSE_PASSWORD: mingle_secret
      CLICKHOUSE_DB: mingle_analytics
    ports:
      - "8123:8123"  # HTTP
      - "9002:9000"  # Native (using 9002 to avoid conflicts)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  clickhouse_data:
