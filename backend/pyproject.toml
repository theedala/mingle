[project]
name = "mingle-backend"
version = "1.0.0"
description = "Privacy-first social matching platform API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastAPI
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    # Database - PostgreSQL
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    # Database - Redis
    "redis>=5.0.1",
    # Database - MongoDB
    "motor>=3.3.2",
    "pymongo>=4.6.1",
    # Database - ClickHouse
    "clickhouse-connect>=0.7.0",
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.5.3",
    "pydantic-settings>=2.1.0",
    # WebSocket & Real-time
    "websockets>=12.0",
    "python-socketio>=5.11.0",
    # Validation
    "email-validator>=2.1.0",
    # HTTP Client
    "httpx>=0.26.0",
    # Environment
    "python-dotenv>=1.0.0",
    "greenlet>=3.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
