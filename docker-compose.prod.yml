version: "3.8"

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - mingle-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - mingle-network
    depends_on:
      - backend

  # FastAPI Backend
  backend:
    build:
      context: ./backend
    environment:
      - ENV=production
      - DEBUG=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-mingle}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mingle_secret}
      - POSTGRES_DB=${POSTGRES_DB:-mingle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USER=${MONGODB_USER:-mingle}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-mingle_secret}
      - MONGODB_DB=${MONGODB_DB:-mingle}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_HTTP_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-mingle}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-mingle_secret}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-mingle_analytics}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - CORS_ORIGINS=["http://localhost","https://your-domain.com"]
    restart: unless-stopped
    networks:
      - mingle-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mingle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mingle_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mingle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - mingle-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mingle}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mingle-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Chat Messages
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-mingle}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-mingle_secret}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - mingle-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse for Analytics
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-mingle}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-mingle_secret}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-mingle_analytics}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped
    networks:
      - mingle-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mingle-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  clickhouse_data:
